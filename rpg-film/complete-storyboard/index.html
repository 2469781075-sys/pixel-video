<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窗 · 完整静态分镜</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1727;color:#edf2fc;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px 22px}h1{font-size:30px;margin:0 0 8px}.intro{color:#afbed7;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.card{padding:0;text-align:left;color:inherit;background:#17263d;border:1px solid #314663;border-radius:12px;overflow:hidden;cursor:pointer}.card:hover,.card:focus-visible{border-color:#82c3e3;outline:2px solid #82c3e3}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#071024}.card strong{display:block;padding:12px 14px;font-size:18px}.card small{display:block;padding:0 14px 14px;color:#b9c8df;font-size:14px}dialog{width:min(1450px,96vw);max-height:96vh;padding:16px;background:#0d1727;color:#eef4fc;border:1px solid #647e9f;border-radius:12px}dialog::backdrop{background:rgba(0,0,0,.88)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar h2{margin:0;font-size:22px}.controls{display:flex;gap:8px}.controls button{padding:8px 14px;font:inherit;color:#edf2fc;background:#253c59;border:1px solid #657d9d;border-radius:7px;cursor:pointer}.controls button:disabled{opacity:.35;cursor:default}#full{display:block;width:100%;max-height:70vh;object-fit:contain;background:#071024}#lines p{margin:10px 0;font-size:18px}#note{color:#bfd0e9;font-size:15px}.foot{color:#99acc6;margin-top:32px}@media(max-width:640px){main{padding:20px 12px}.grid{grid-template-columns:1fr}dialog{padding:10px}.controls button{padding:6px 10px}#lines p{font-size:16px}}
</style></head><body><main><h1>窗 · 完整静态分镜</h1><p class="intro">16 张关键图 · 对应全文 21 句 · 强像素掌机 RPG<br>点击查看大图与完整原文，按左右方向键切换。当前为静态图，正式视频保留全文曼波朗读。</p><div class="grid" id="grid"></div><p class="foot">四张核心构图与新增画面按原文顺序排列，原版继续保留。</p></main>
<dialog id="viewer" aria-label="分镜大图"><div class="bar"><h2 id="title"></h2><div class="controls"><button id="prev">上一张</button><button id="next">下一张</button><button id="close">关闭</button></div></div><img id="full" alt=""><div id="lines"></div><p id="note"></p></dialog>
<script id="data" type="application/json">[{"n":1,"title":"教室的拥挤","file":"01-cramped-classroom.png","texts":["不知道大家的中学生活是怎么样的？","主播高中的教室是狭窄逼仄的。"],"purpose":"建立教室空间与主人公位置，保留已确认核心构图。","excerpt":false},{"n":2,"title":"桌列与高台","file":"02-desks-and-platform.png","texts":["教室的布局说来也简单，几路层层格格的铁轨规矩地张满地板，前头努力抵住前面的山坳，毕竟那上面还有座高高的庙。"],"purpose":"用桌腿与地砖引线、清晰的一层高台和台上讲桌表现原文比喻。","excerpt":false},{"n":3,"title":"后排的呼吸","file":"03-rear-breathing-space.png","texts":["后面留了些空，以供我们偶尔快活地呼吸，不至于终日只做个夹层里的石子，任人布置、碾轧。"],"purpose":"展示真实后排通道与站立交流，把拥挤中的空隙画出来。","excerpt":false},{"n":4,"title":"找不到河流的边界","file":"04-river-boundaries.png","texts":["我其实一直不懂，同学们分明与我在同一条河流里面翻来覆去，却轻而易举地找到了水的边界。"],"purpose":"以主角停在河中踏石、同学已走上河岸表现同在河流却找不到边界。","excerpt":false},{"n":5,"title":"同学的小世界","file":"05-little-worlds.png","texts":["仔细想来，他们开学不久就已经能各自取乐了。","他们围成了一个个小小世界，讲述着我听不懂的历史。"],"purpose":"保留已确认群像，用具体阅读交流与主角的距离表现各自取乐。","excerpt":false},{"n":6,"title":"靠窗与欢笑的挤压","file":"06-window-seat.png","texts":["我经常被安排到最左边靠窗的位置。","欢笑的空间实在挤压了我的生存，我真想拨开窗啊！"],"purpose":"用正常窗边座位、未完成的作业和旁边的交流表现想开窗的动机。","excerpt":false},{"n":7,"title":"方格里的梦想","file":"07-dream-in-window.png","texts":["那四四方方的格子里，或许住着一个梦想也说不定。"],"purpose":"独立窗格细节把梦想放在玻璃外，主角倒影留在室内。","excerpt":false},{"n":8,"title":"目光与沉默","file":"08-gaze-and-silence.png","texts":["只是我能经受灼热目光的冒险吗？","我本就不知道怎么办了，我孤冷又沉默，淫秽却无聊......"],"purpose":"用收肩、低头、攥笔和同学的短暂视线表现犹豫与沉默。","excerpt":false},{"n":9,"title":"同桌离席，伸向窗扣","file":"09-deskmate-leaves.png","texts":["但是，说不清道不明，趁着同桌不在，挟着自怜和愿望，我总是开了。"],"purpose":"让同桌真实离开原座位，空椅与物品留下，主角才伸手触窗。","excerpt":false},{"n":10,"title":"第一人称横向推窗","file":"10-first-person-window.png","texts":["意识蹒跚着爬上窗扣，肢体却得到了勇气的奖赏，我缓缓支走那两片玻璃，天地之间唤起一片清澈的凉，教室里面映满了雨水和露水的影子，终是把我们都接成一片了。"],"purpose":"保留已确认第一人称构图，统一像素颗粒与窗户的水平轨道。","excerpt":false},{"n":11,"title":"风进入教室","file":"11-after-opening.png","texts":["我享受这份拥抱，因为它赞许了我们的自由。"],"purpose":"保留强像素核心图，表现开窗后的纸页、发梢、光色与主角状态。","excerpt":false},{"n":12,"title":"风与流向夜色的河","file":"12-wind-and-night-river.png","texts":["或者它才是自由本身，这缕亭亭玉立的风，这条潺潺流往夜色的河，它们融进了我的血，它们才是我！"],"purpose":"把风、河流与主角连成同一运动方向，并让河流延伸入夜色。","excerpt":false},{"n":13,"title":"意气风发的想象","file":"13-social-confidence.png","texts":["是的，我不是一个弱小的学生，我本也可以意气风发，学着男同学去和女同学调笑，享受她们的娇嫩欲滴。"],"purpose":"画出主角幻想中的主动交流与自信，人物保持自然、完整的校服形象。","excerpt":true},{"n":14,"title":"优雅骑士与学校的君主","file":"14-knight-and-school-king.png","texts":["或者当一个美丽优雅的骑士，去为学校的君主做事，讨来货币和爱情。"],"purpose":"为骑士联想绘制全新幻想场景，用高台和绿色墙面呼应现实教室。","excerpt":false},{"n":15,"title":"回到原位，仍跑不出去","file":"15-return-to-classroom.png","texts":["但是我不会去做的，我只是想保持现状，因为我根本不知道怎么才能办得到啊。","我还是跑不出那间教室啊，那阵风成了我的症候。"],"purpose":"通过合上想象中的书、恢复校服和原座位、暮色变暗表现保持现状与受困。","excerpt":false},{"n":16,"title":"夜色里的全部光明","file":"16-final-window-light.png","texts":["夜色撇下一抹沉沉的亮，竟成了我的全部光明。"],"purpose":"让窗光成为脸和纸页上唯一清楚的亮色，用新的夜间近景收住全文。","excerpt":false}]</script>
<script>
const shots=JSON.parse(document.getElementById('data').textContent);
const grid=document.getElementById('grid'),viewer=document.getElementById('viewer');
let current=0;
for(const [i,s] of shots.entries()){const card=document.createElement('button');card.className='card';const img=document.createElement('img');img.src=s.file;img.alt=s.title;img.loading='lazy';const title=document.createElement('strong');title.textContent=String(s.n).padStart(2,'0')+' · '+s.title;const info=document.createElement('small');info.textContent=s.purpose;card.append(img,title,info);card.addEventListener('click',()=>{show(i);viewer.showModal()});grid.append(card)}
function show(i){current=i;const s=shots[i];document.getElementById('title').textContent=String(s.n).padStart(2,'0')+' · '+s.title;const full=document.getElementById('full');full.src=s.file;full.alt=s.title;const lines=document.getElementById('lines');lines.replaceChildren();for(const text of s.texts){const p=document.createElement('p');p.textContent=text;lines.append(p)}document.getElementById('note').textContent=s.excerpt?'图中文字为前半句示意，上方保留完整原文。':s.purpose;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===shots.length-1}
document.getElementById('prev').onclick=()=>show(Math.max(0,current-1));document.getElementById('next').onclick=()=>show(Math.min(shots.length-1,current+1));document.getElementById('close').onclick=()=>viewer.close();document.addEventListener('keydown',event=>{if(!viewer.open)return;if(event.key==='ArrowLeft'){event.preventDefault();show(Math.max(0,current-1))}if(event.key==='ArrowRight'){event.preventDefault();show(Math.min(shots.length-1,current+1))}});
</script></body></html>
